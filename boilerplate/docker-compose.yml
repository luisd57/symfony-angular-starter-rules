# Replace {{project}} throughout. Secrets default to CHANGE_ME — override them in a
# local .env next to this file (gitignored).
#
# No top-level `version:` key — Compose v2 ignores it and warns.
#
# The network is called `backend`, not `<project>_backend`: Compose already prefixes
# network and volume names with the project name, so prefixing again yields
# `myapp_myapp_network`.

services:
  php:
    build:
      context: ./API
      dockerfile: docker/php/Dockerfile
    container_name: "{{project}}_php"
    volumes:
      - ./API:/var/www/html
      - ./API/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      # Named volumes keep container-owned vendor/ and var/ off the host bind
      # mount. Consequence: vendor/ never appears on the host, so the editor
      # cannot resolve Symfony symbols. Expected — see dev-gotchas.md.
      - php_vendor:/var/www/html/vendor
      - php_var:/var/www/html/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      DATABASE_URL: "postgresql://{{project}}_user:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/{{project}}_db?serverVersion=16&charset=utf8"

  nginx:
    image: nginx:alpine
    container_name: "{{project}}_nginx"
    ports:
      - "8080:80"
    volumes:
      - ./API:/var/www/html
      - ./API/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: "{{project}}_postgres"
    environment:
      POSTGRES_DB: "{{project}}_db"
      POSTGRES_USER: "{{project}}_user"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME}"
    # Loopback-bound: the database is never reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Lets dependents wait for readiness instead of racing the first connection.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{project}}_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: "{{project}}_redis"
    command: redis-server --requirepass "${REDIS_PASSWORD:-CHANGE_ME}"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-CHANGE_ME}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  mailhog:
    image: mailhog/mailhog
    container_name: "{{project}}_mailhog"
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend

  # Delete this service if the domain has no scheduled commands.
  cron:
    build:
      context: ./API
      dockerfile: docker/cron/Dockerfile
    container_name: "{{project}}_cron"
    volumes:
      - ./API:/var/www/html
      - ./API/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - php_vendor:/var/www/html/vendor
      - php_var:/var/www/html/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      DATABASE_URL: "postgresql://{{project}}_user:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/{{project}}_db?serverVersion=16&charset=utf8"

  app:
    image: node:22-alpine
    container_name: "{{project}}_app"
    working_dir: /app
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    # --poll: file events from a Windows/macOS bind mount never reach the
    # container's inotify, so without it the dev server stops rebuilding.
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 2000"
    networks:
      - backend

  # Delete this service if there is no public landing site.
  landing:
    image: node:22-alpine
    container_name: "{{project}}_landing"
    working_dir: /app
    volumes:
      - ./landing:/app
      - landing_node_modules:/app/node_modules
    ports:
      - "4321:4321"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - backend

  playwright:
    # Pin to the same minor as app/package.json @playwright/test — a mismatch
    # between the client and the browsers baked into the image fails at runtime.
    # Browsers are preinstalled; no separate `playwright install` needed.
    # One-shot runner, not started by `up`:
    #   docker compose --profile e2e run --rm playwright
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    container_name: "{{project}}_playwright"
    working_dir: /app
    volumes:
      - ./app:/app
      - playwright_node_modules:/app/node_modules
    networks:
      - backend
    environment:
      APP_URL: "${APP_URL:-http://app:4200}"
      MAILHOG_URL: "${MAILHOG_URL:-http://mailhog:8025}"
      # {{FILL: the seeded admin credentials the suite logs in with}}
      CI: "1"
    command: sh -c "npm install --omit=optional --no-audit --no-fund && npx playwright test"
    depends_on:
      - app
      - nginx
      - mailhog
    profiles:
      - e2e

  playwright-report:
    # Serves app/playwright-report/ over HTTP. The trace viewer runs on a Service
    # Worker, which does not work over file:// — opening the report directly
    # gives a blank trace.
    #   docker compose --profile e2e up playwright-report   → http://localhost:9323
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    container_name: "{{project}}_playwright_report"
    working_dir: /app
    volumes:
      - ./app:/app
      - playwright_node_modules:/app/node_modules
    ports:
      - "9323:9323"
    command: sh -c "test -d node_modules || npm install --omit=optional --no-audit --no-fund; npx playwright show-report --host 0.0.0.0"
    profiles:
      - e2e

  playwright-landing:
    # Self-contained: starts its OWN Astro dev server via Playwright's webServer,
    # bound to 127.0.0.1 so the page origin satisfies the API's loopback CORS
    # rule. PUBLIC_API_BASE_URL is overridden to reach nginx on the compose
    # network — the landing/.env default (localhost:8080) is unreachable from
    # inside this container.
    #   docker compose --profile e2e run --rm playwright-landing
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    container_name: "{{project}}_playwright_landing"
    working_dir: /app
    volumes:
      - ./landing:/app
      - landing_playwright_node_modules:/app/node_modules
    networks:
      - backend
    environment:
      LANDING_URL: "${LANDING_URL:-http://127.0.0.1:4321}"
      API_BASE_URL: "${LANDING_API_BASE_URL:-http://nginx/api}"
      PUBLIC_API_BASE_URL: "${LANDING_API_BASE_URL:-http://nginx/api}"
      CI: "1"
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    depends_on:
      - nginx
    profiles:
      - e2e

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: "{{project}}_pgadmin"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@example.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-CHANGE_ME}"
      PGPASSFILE: /tmp/pgpassfile
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./API/docker/pgadmin/servers.json:/pgadmin4/servers.json
      - ./API/docker/pgadmin/pgpassfile:/tmp/pgpassfile
    depends_on:
      - postgres
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  app_node_modules:
  landing_node_modules:
  playwright_node_modules:
  landing_playwright_node_modules:
  php_vendor:
  php_var:
